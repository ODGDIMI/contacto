<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Usuario controlado</title>
<style>
:root{color-scheme:light;--naranja:#f28c00}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff!important;color:#000!important;font-family:Georgia,"Times New Roman",serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px}
.contenido{width:min(92vw,520px);text-align:center}
.logo{display:block;width:min(62vw,285px);height:auto;margin:0 auto 28px}
.titulo{margin:0;font-size:clamp(34px,9vw,62px);line-height:1.05;font-weight:800;letter-spacing:.5px}
.codigo-linea{margin-top:52px;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:nowrap}
.codigo{font-family:"Times New Roman",Times,serif;font-size:clamp(38px,11vw,70px);line-height:1;font-weight:800;letter-spacing:1px;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1}
.check{width:clamp(54px,14vw,82px);aspect-ratio:1;border-radius:50%;position:relative;flex:0 0 auto;background:radial-gradient(circle at 45% 30%,#ffd69a 0 13%,transparent 14%),linear-gradient(180deg,#ffb13b 0%,var(--naranja) 58%,#d56d00 100%);border:4px solid #e37c00;box-shadow:inset 0 0 0 3px #ffd16c,0 3px 8px rgba(0,0,0,.18)}
.check::after{content:"";position:absolute;left:25%;top:24%;width:42%;height:23%;border-left:clamp(6px,1.5vw,9px) solid #fff;border-bottom:clamp(6px,1.5vw,9px) solid #fff;transform:rotate(-45deg);filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.invalido .codigo-linea{margin-top:38px}
.invalido .codigo{color:#9b1c1c;font-size:clamp(28px,8vw,48px);white-space:normal}
.invalido .check{display:none}
@media(max-width:420px){body{padding:18px}.logo{margin-bottom:24px}.codigo-linea{gap:12px;margin-top:42px}}
</style>
</head>
